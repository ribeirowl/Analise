services:
  # ── Python microservice (ScraperFC + StatsBomb) ──────────────────────────────
  - type: web
    name: analise-futebol-python
    runtime: python
    region: oregon
    plan: free
    rootDir: apps/python-service
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_SERVICE_PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  # ── Node.js backend ──────────────────────────────────────────────────────────
  - type: web
    name: analise-futebol-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build --workspace=apps/backend
    startCommand: node apps/backend/dist/apps/backend/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: 10000
      - key: ODDS_API_REGIONS
        value: eu,uk
      - key: ODDS_API_BOOKMAKERS
        value: bet365,pinnacle,betfair_ex_eu
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PYTHON_SERVICE_URL
        sync: false

  # ── Next.js frontend ─────────────────────────────────────────────────────────
  - type: web
    name: analise-futebol-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/frontend
    buildCommand: cd ../.. && npm install && cd apps/frontend && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
